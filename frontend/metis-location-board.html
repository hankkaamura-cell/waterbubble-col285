<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>METIS Location Sharing Board</title>
  <style>
    :root {
      --bg: #06101d;
      --panel: rgba(12, 22, 40, 0.86);
      --line: rgba(140, 200, 255, 0.18);
      --text: rgba(255,255,255,0.88);
      --dim: rgba(255,255,255,0.58);
      --accent: rgba(120,190,255,0.95);
      --live: #7CFFB2;
      --recent: #FFD36A;
      --last: #FF9C6A;
      --unknown: #9AA7B2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #102644, var(--bg)); color: var(--text); font-family: system-ui, Segoe UI, sans-serif; }
    main { width: min(1180px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; }
    .sub { color: var(--dim); margin-top: 6px; }
    .pill { border: 1px solid var(--line); background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 999px; font-size: 12px; color: var(--dim); }
    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 18px 0; }
    .stat, .card { background: linear-gradient(180deg, var(--panel), rgba(12,22,40,0.54)); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.28); }
    .stat { padding: 14px; }
    .stat b { display: block; font-size: 24px; color: var(--accent); }
    .stat span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 12px; }
    .card { padding: 14px; }
    .topline { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .name { font-weight: 800; font-size: 16px; }
    .role { font-size: 12px; color: var(--dim); margin-top: 2px; }
    .status { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 4px 8px; }
    .live { color: var(--live); } .recent { color: var(--recent); } .last_known { color: var(--last); } .unknown { color: var(--unknown); }
    .system { margin-top: 14px; font-size: 17px; color: white; }
    .meta { margin-top: 8px; display: grid; gap: 5px; font-size: 13px; color: var(--dim); }
    .source { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--dim); }
    .error { color: #ff8d8d; padding: 12px; border: 1px solid rgba(255,100,100,0.3); border-radius: 12px; background: rgba(255,0,0,0.08); }
    @media (max-width: 760px) { header { display:block; } .summary { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>METIS Location Sharing</h1>
        <div class="sub">Phase 1 / Layer 1 — squadron location board</div>
      </div>
      <div class="pill" id="generated">Waiting for backend...</div>
    </header>

    <section class="summary" id="summary"></section>
    <section id="errors"></section>
    <section class="grid" id="grid"></section>
  </main>

  <script>
    const API_BASE = window.METIS_API_BASE || "http://127.0.0.1:8000";
    const boardUrl = API_BASE.replace(/\/$/, "") + "/api/metis/location-sharing/board";
    const summary = document.getElementById("summary");
    const grid = document.getElementById("grid");
    const generated = document.getElementById("generated");
    const errors = document.getElementById("errors");

    function safe(value, fallback = "Unknown") { return value || fallback; }
    function ago(minutes) {
      if (minutes === null || minutes === undefined) return "unknown age";
      if (minutes < 1) return "just now";
      if (minutes === 1) return "1 minute ago";
      if (minutes < 60) return `${minutes} minutes ago`;
      const hours = Math.floor(minutes / 60);
      return hours === 1 ? "1 hour ago" : `${hours} hours ago`;
    }

    function render(board) {
      errors.innerHTML = "";
      generated.textContent = `Generated ${new Date(board.generated_at).toLocaleString()} · refreshes every ${board.update_cadence_seconds}s`;
      const counts = board.counts || {};
      summary.innerHTML = ["total", "live", "recent", "last_known", "unknown"].map(key => `
        <div class="stat"><b>${counts[key] ?? 0}</b><span>${key.replace("_", " ")}</span></div>
      `).join("");

      grid.innerHTML = (board.commanders || []).map(c => `
        <article class="card">
          <div class="topline">
            <div>
              <div class="name">${safe(c.display_name || c.commander_name)}</div>
              <div class="role">${safe(c.squadron_role, "Squadron Member")}</div>
            </div>
            <div class="status ${c.confidence}">${c.confidence.replace("_", " ")}</div>
          </div>
          <div class="system">${safe(c.system_name)}</div>
          <div class="meta">
            <div>Station: ${safe(c.station_name, "—")}</div>
            <div>Ship: ${safe(c.ship_type, "—")}</div>
            <div>Last seen: ${ago(c.age_minutes)}</div>
          </div>
          <div class="source">Source: ${safe(c.source)}${c.source_detail ? " · " + c.source_detail : ""}</div>
        </article>
      `).join("") || `<div class="error">No commanders have reported into METIS yet.</div>`;
    }

    async function refresh() {
      try {
        const response = await fetch(boardUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (err) {
        errors.innerHTML = `<div class="error">Could not reach METIS backend at ${boardUrl}: ${err}</div>`;
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
